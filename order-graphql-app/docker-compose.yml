services:
  db:
    image: postgres:16-alpine
    container_name: orders-db
    environment:
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: orders_pass
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  api:
    build:
      context: ./backend
    container_name: orders-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: orders_user
      DB_PASSWORD: orders_pass
      DB_NAME: orders_db
      CORS_ORIGIN: http://localhost:8080
    depends_on:
      - db
    ports:
      - "4000:4000"

  web:
    build:
      context: ./frontend
    container_name: orders-web
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
